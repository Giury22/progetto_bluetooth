buildscript {
    ext {
        // Imposta la versione di Kotlin (aggiorna se necessario)
        kotlin_version = '1.7.10'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Classepath per il plugin Android Gradle; aggiorna la versione se necessario
        classpath 'com.android.tools.build:gradle:7.3.1'
        // Classepath per il plugin Kotlin Gradle
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Nota: il plugin Flutter viene applicato tramite il file build.gradle del modulo app usando il DSL dei plugin.
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    // Imposta la cartella di build per ogni subproject
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    // Fai in modo che ogni subproject dipenda dall'app principale
    project.evaluationDependsOn(":app")
}

// Task per pulire la cartella di build
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
